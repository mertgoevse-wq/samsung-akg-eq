name: Sonora CI / CD

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-and-test:
    name: Build & Verify Sonora Android App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: standard
            flavor_title: Standard
          - flavor: parallel
            flavor_title: Parallel
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: List available Gradle tasks
        run: ./gradlew tasks --all --stacktrace

      - name: Run Unit & DSP Tests (${{ matrix.flavor }})
        run: ./gradlew test${{ matrix.flavor_title }}DebugUnitTest --stacktrace

      - name: Run Android Lint (${{ matrix.flavor }})
        run: ./gradlew lint${{ matrix.flavor_title }}Debug --stacktrace

      - name: Assemble Debug APK (${{ matrix.flavor }})
        run: ./gradlew assemble${{ matrix.flavor_title }}Debug --stacktrace

      - name: Compute APK SHA-256 checksums
        id: checksums
        run: |
          APK_DIR=app/build/outputs/apk/${{ matrix.flavor }}/debug
          APK_PATH=$(ls "$APK_DIR"/*.apk | head -1)
          APK_NAME=$(basename "$APK_PATH")
          echo "filename=$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          sha256sum "$APK_PATH" > "$APK_PATH.sha256"
          echo "checksum=$(sha256sum "$APK_PATH" | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Verify APK exists and is non-empty
        run: |
          test -s ${{ steps.checksums.outputs.apk_path }} || { echo "APK missing or empty"; exit 1; }
          echo "APK OK: ${{ steps.checksums.outputs.filename }}"

      - name: Upload Test Report (${{ matrix.flavor }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ matrix.flavor }}
          path: app/build/reports/tests/test${{ matrix.flavor_title }}DebugUnitTest/
          retention-days: 14

      - name: Upload Lint Report (${{ matrix.flavor }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-${{ matrix.flavor }}
          path: app/build/reports/lint-results-${{ matrix.flavor }}.html
          retention-days: 14

      - name: Upload Debug APK (${{ matrix.flavor }})
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sonora-${{ matrix.flavor }}-debug-apk
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          retention-days: 30

      - name: Upload SHA-256 Checksum File (${{ matrix.flavor }})
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sonora-checksums-${{ matrix.flavor }}
          path: ${{ steps.checksums.outputs.apk_path }}.sha256
          retention-days: 30
